name: Build book

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  PDF_NAME: operator-algebra-modular-theory-and-quantum-gravity.pdf

jobs:
  build:
    name: Compile book
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate main.tex
        run: python3 scripts/gen.py

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v2
        with:
          root_file: main.tex
          args: >-
            -pdf
            -jobname=operator-algebra-modular-theory-and-quantum-gravity
            -file-line-error
            -halt-on-error
            -interaction=nonstopmode

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: book-pdf
          path: ${{ env.PDF_NAME }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download compiled PDF
        uses: actions/download-artifact@v8
        with:
          name: book-pdf
          path: .

      - name: Create release and upload PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "${PDF_NAME}"
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
